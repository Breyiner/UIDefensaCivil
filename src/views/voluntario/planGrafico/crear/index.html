<div class="container">

    <div class="explicacion">

        <div class="explicacion__titulo">

            <i class="ri-home-4-fill"></i>

            <span>Agregar gráfico</span>

            <p>Agrega el plano o planos de la vivienda.</p>

        </div>

        <img src="asset/ilustracion_voluntaria_a_cabeza.svg" alt="">

    </div>

    <div class="SubirImagen">
        <button class="boton">Subir Grafico</button>
        <input type="file" id="imagenInput" accept="image/*">
    </div>
    <img id="preview" class="oculto"/>
    <p class="explicacion__subtitulo imagen__titulo"></p>
    <form class="form" action="">
        <div class="input">
            <div class="form__inputBox">
                <i class="ri-t-box-line"></i>
                <textarea placeholder="Descripcion del grafico (maximo 255 caracteres)" id="descripcion" autocomplete="off"></textarea>
            </div>
        </div>
        <button class="boton" id="botonCrear" disabled>Crear</button>
    </form>
</div>
