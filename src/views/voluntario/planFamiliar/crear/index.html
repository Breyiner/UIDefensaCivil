<div class="container">

    <div class="explicacion">

        <div class="explicacion__titulo"> 

            <i class="ri-team-fill"></i>

            <span>Registro familiar</span>

            <p>Llene los datos con la informacion inicial de la familia.</p>

        </div>

        <img src="asset/ilustracion_menu.svg" alt="">

   </div>

    <form method="POST" class="form">
        <div class="input">
            <div class="form__inputBox">
                <i class="ri-parent-line"></i>
                <input type="text" placeholder="Apellidos de la familia" id="apellidos" autocomplete="off">
            </div>
        </div>
        <div class="input">
            <div class="form__inputBox form__inputBox--selector">
                <i class="ri-map-line" id="selector__icono"></i>
                <select class="selector" id="zonas">
                    <option value="" hidden>Seleccione un tipo de zona...</option>
                </select>
            </div>
        </div>
        <div class="input">
            <div class="form__inputBox form__inputBox--selector">
                <i class="ri-building-line" id="selector__icono"></i>
                <select class="selector" id="departamentos">
                    <option value="" hidden>Seleccione el departamento...</option>
                </select>
            </div>
        </div>
        <div class="input">
            <div class="form__inputBox form__inputBox--selector">
                <i class="ri-building-4-line" id="selector__icono"></i>
                <select class="selector" id="ciudades" disabled>
                    <option value="" hidden>Seleccione la ciudad...</option>
                </select>
            </div>
        </div>
        <button class="boton" id="boton_siguiente" disabled>Siguiente</button>
    </form>
</div>
