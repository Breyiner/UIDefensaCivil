<div class="container">

  <div class="explicacion">

    <div class="explicacion__titulo"> 

      <i class="ri-bubble-chart-fill"></i>

      <span>Identificación familiar</span>

      <p>Datos principales de la familia que se usaron al registrarse.</p>
    </div>

    <img src="asset/ilustracion_datos.svg" alt="">

  </div>

  <form method="POST" class="form">

    <div class="input">
      <div class="form__inputBox">
        <i class="ri-id-card-line"></i>
        <input type="text" placeholder="Familia segura N°" id="familiaId" autocomplete="off" disabled />
      </div>
    </div>


    <div class="input">
      <div class="form__inputBox">
        <i class="ri-error-warning-line"></i>
        <input type="text" placeholder="Tipo de familia: " id="tipoFamilia" autocomplete="off" disabled />
      </div>
    </div>


    <div class="input">
      <div class="form__inputBox">
        <i class="ri-parent-line"></i>
        <input type="text" placeholder="Apellidos de la familia" id="apellidos" autocomplete="off" />
      </div>
    </div>

    <div class="input">
      <div class="form__inputBox form__inputBox--selector">
        <i class="ri-map-line" id="selector__icono"></i>
        <select class="selector-portatil" id="zonas">
          <option value="" hidden>Seleccione un tipo de zona...</option>
        </select>
      </div>
    </div>

    <div class="input">
      <div class="form__inputBox form__inputBox--selector">
        <i class="ri-building-line" id="selector__icono"></i>
        <select class="selector-portatil" id="departamentos">
          <option value="" hidden>Seleccione el departamentos...</option>
        </select>
      </div>
    </div>

    <div class="input">
      <div class="form__inputBox form__inputBox--selector">
        <i class="ri-building-4-line" id="selector__icono"></i>
        <select class="selector-portatil" id="ciudades" disabled>
          <option value="" hidden>Seleccione la ciudad...</option>
        </select>
      </div>
    </div>

    <div class="input">
      <div class="form__inputBox">
        <i class="ri-map-pin-2-line"></i>
        <input type="text" placeholder="Dirrecion" name="dirrecion" id="dirrecion" autocomplete="off" />
      </div>
    </div>

    <div class="input">
      <div class="form__inputBox form__inputBox--selector">
        <i class="ri-community-line" id="selector__icono"></i>
        <select class="selector-portatil" id="sectores">
          <option value="" hidden>Seleccione un sector...</option>
        </select>
      </div>
    </div>

    <div class="input">
      <div class="form__inputBox">
        <i class="ri-building-line"></i>
        <input type="text" placeholder="Escriba el nombre de su sector" id="sectorNombre" autocomplete="off" />
      </div>
    </div>

    <div class="input">
      <div class="form__inputBox">
        <i class="ri-phone-line"></i>
        <input type="text" placeholder="telefono fijo (si tiene)" id="telefonoFijo" autocomplete="off" />
      </div>
    </div>

    <div class="input">
      <div class="form__inputBox form__inputBox--selector">
        <i class="ri-home-2-line" id="selector__icono"></i>
        <select class="selector-portatil" id="calidadesVivienda">
          <option value="" hidden>Seleccione una calidad de vivienda...</option>
        </select>
      </div>
    </div>

    <button class="boton" id="boton_guardar" disabled>Guardar</button>

  </form>

</div>
