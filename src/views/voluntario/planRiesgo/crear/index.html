<div class="container">

    <div class="explicacion">

        <div class="explicacion__titulo">

            <i class="ri-map-pin-2-fill"></i>

            <span>Agregar riesgo</span>

            <p>Agrega información relacionada con distintos riesgos a los que la familia y su hogar estan expuestos.</p>

        </div>

        <img src="asset/ilustracion_voluntario_cabeza.svg" alt="">

    </div>

    <form method="POST" class="form">

        <div class="input">
            <div class="form__inputBox form__inputBox--selector">
                <i class="ri-error-warning-line" id="selector__icono"></i>
                <select class="selector" id="tiposAmenaza">
                    <option value="" hidden>Seleccione un tipo de amenaza...</option>
                </select>
            </div>
        </div>

        <div class="input">
            <div class="form__inputBox">
                <i class="ri-file-text-line"></i>
                <textarea id="descripcion" placeholder="Descripcion" autocomplete="off"></textarea>
            </div>
        </div>

        <div class="input">
            <div class="form__inputBox">
                <i class="ri-map-2-line"></i>
                <input type="text" id="ubicacion" placeholder="Ubicacion del riesgo" autocomplete="off">
            </div>
        </div>

        <div class="input">
            <div class="form__inputBox">
                <i class="ri-map-pin-line"></i>
                <input type="text" id="distancia" placeholder="Distancia del riesgo" autocomplete="off">
            </div>
        </div>

        <button class="boton" id="botonSiguiente" disabled>Seguiente</button>

    </form>
</div>
