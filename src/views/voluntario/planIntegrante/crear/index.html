<div class="container">
    <div class="explicacion">
        <p class="explicacion__titulo">Integrantes de la familia</p>
        <p class="explicacion__subtitulo">Llene los datos con la informacion del integrante</p>
    </div>
<form method="POST" class="form">
    <div class="input">
        <div class="form__inputBox">
            <i class="ri-user-fill"></i>
            <input type="text" class="form__input input__nombres" placeholder="nombres" autocomplete="off"
                data-tipo="textoEspacio"
                data-min="3"
            >
        </div>
    </div>
    <div class="input">
        <div class="form__inputBox">
            <i class="ri-user-fill"></i>
            <input type="text" class="form__input input__apellidos" placeholder="apellidos" autocomplete="off"
            data-tipo="textoEspacio"
            data-min="3">
        </div>
    </div>
    <div class="input">
        <div class="form__inputBox form__inputBox--selector">
            <i class="ri-id-card-fill" id="selector__icono"></i>
            <select class="form__input input__tipoDocumento" id="selector">
            <option value ="" hidden>Seleccione un tipo de documento...</option>
            </select>
        </div>
    </div>
    <div class="input">
        <div class="form__inputBox">
            <i class="ri-info-card-fill"></i>
            <input type="text" class="form__input input__numDocumento" placeholder="numero de documento" autocomplete="off"
            data-min="numero"
            >
        </div>
    </div>
    <div class="input">
        <div class="form__inputBox form__inputBox--selector">
            <i class="ri-men-fill" id="selector__icono"></i>
            <select class="form__input input__genero" id="selector">
            <option value ="" hidden>Seleccione un genero...</option>
            </select>
        </div>
    </div>
    <div class="input">
        <div class="form__inputBox--double">
            <div class="form__inputBox">
                <i class="ri-cake-2-fill"></i>
                <input type="date" class="form__input input__nacimiento" placeholder="fecha de nacimiento" autocomplete="off">
            </div>
            <div class="form__inputBox">
                <i class="ri-health-book-fill"></i>
                <input type="text" class="form__input input__eps" placeholder="eps" autocomplete="off"
                    data-min="3"
                    data-tipo="textoEspacio"
                    data-opcional="true"
                >
            </div>
        </div>
    </div>
    <div class="input">
        <div class="form__inputBox form__inputBox--selector">
            <i class="ri-team-fill" id="selector__icono"></i>
            <select class="form__input input__parentesco" id="selector">
            <option value ="" hidden>Seleccione un parentesco...</option>
            </select>
        </div>
    </div>
    <div class="input">
        <div class="form__inputBox form__inputBox--selector">
            <i class="ri-heart-pulse-fill" id="selector__icono"></i>
            <select class="form__input input__grupoSanguineo" id="selector">
            <option value ="" hidden>Seleccione un grupo sanguineo...</option>
            </select>
        </div>
    </div>
    <div class="input">
        <div class="form__inputBox form__inputBox--selector">
            <i class="ri-flag-fill" id="selector__icono"></i>
            <select class="form__input input__nacionalidad" id="selector">
            <option value ="" hidden>Seleccione un nacionalidad...</option>
            </select>
        </div>
    </div>
    <div class="input">
        <div class="form__inputBox">
                <i class="ri-phone-fill"></i>
                <input type="text" class="form__input input__celular" placeholder="celular personal" autocomplete="off"
                data-min="7"
                data-max="10"
                data-opcional="true"
                >
        </div>
    </div>
    <button class="form__boton boton" disabled>Guardar</button>
</form>
</div>
