<div class="container">
    <div class="explicacion">
        <p class="explicacion__titulo">Plan de accion</p>
        <p class="explicacion__subtitulo">Informacion y acciones con sus miembros, para el factor de riesgo</p>
    </div>
    <form method="POST" class="form">
        <div class="input">
            <div class="form__inputBox form__inputBox--selector">
                <i class="ri-user-line" id="selector__icono"></i>
                <select class="selector" id="miembro">
                    <option value="" hidden>Seleccione un miembro...</option>
                </select>
            </div>
        </div>
        <div class="input">
            <div class="form__inputBox form__inputBox--selector">
                <i class="ri-error-warning-line" id="selector__icono"></i>
                <select class="selector" id="factorRiesgo">
                    <option value="" hidden>Seleccione un factor de riesgo...</option>
                </select>
            </div>
        </div>
        <button class="boton" id="botonGuardar" disabled>Guardar</button>
    </form>
    <div class="container__gap invisible">
    <div class="boton--containerStarEnd">
        <button class="boton" disabled id="atras">Anterior</button>
        <button class="boton" disabled id="siguiente">Siguiente</button>
    </div>
    <div class="gestioarAfecciones">
        <div class="gestionarAfecciones__header">
            <div class="gestionarAfecciones__titulo">
                <i class="ri-alarm-warning-fill"></i>
                <p id="planAccion__titulo"></p>
            </div>
            <button class="gestionarAfecciones__boton boton">Agregar nueva</button>
        </div>
        <div class=" gestionarAfecciones__lista">
        </div>
    </div>
</div>
</div>
