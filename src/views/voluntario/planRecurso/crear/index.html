<div class="container">
    <div class="explicacion">
        <p class="explicacion__titulo">Agregar recurso disponible</p>
        <p class="explicacion__subtitulo">Llene los datos con la informacion del recurso</p>
    </div>

    <form method="POST" class="form">

        <div class="input">
            <div class="form__inputBox form__inputBox--selector">
                <i class="ri-error-warning-line" id="selector__icono"></i>
                <select class="selector" id="recursos">
                    <option value="" hidden>Seleccione un recurso...</option>
                </select>
            </div>
        </div>

        <div class="input">
            <div class="form__inputBox">
                <i class="ri-heart-line"></i>
                <input type="text" id="servicio" placeholder="Servicio del recurso" disabled autocomplete="off">
            </div>
        </div>

        <div class="input">
            <div class="form__inputBox">
                <i class="ri-phone-line"></i>
                <input type="text" id="telefono" placeholder="Telefono del contacto del recurso" autocomplete="off">
            </div>
        </div>

        <div class="input">
            <div class="form__inputBox">
                <i class="ri-file-text-line"></i>
                <textarea id="descripcion" placeholder="Descripcion" autocomplete="off"></textarea>
            </div>
        </div>

        <div class="input">
            <div class="form__inputBox">
                <i class="ri-map-2-line"></i>
                <input type="text" id="ubicacion" placeholder="Ubicacion del recurso" autocomplete="off">
            </div>
        </div>

        <div class="input">
            <div class="form__inputBox">
                <i class="ri-map-pin-line"></i>
                <input type="text" id="distancia" placeholder="Distancia del recurso" autocomplete="off">
            </div>
        </div>

        <button class="boton" id="botonCrear" disabled>Crear</button>

    </form>
</div>
