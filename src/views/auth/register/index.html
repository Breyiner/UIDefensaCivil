<div class="container noHeader">
    <div class="explicacion">
        <p class="explicacion__titulo"> Registro de usuarios</p>
        <p class="explicacion__subtitulo">Llene los datos solicitados para crear su cuenta en el sistema</p>
    </div>
    <form method="POST" class="form">
        <div class="form__inputBox--double">
            <div class="input">
                <div class="form__inputBox">
                    <i class="ri-user-line"></i>
                    <input type="text" placeholder="nombres" id="nombres" autocomplete="off">
                </div>
            </div>
            <div class="input">
                <div class="form__inputBox">
                    <i class="ri-user-line"></i>
                    <input type="text" placeholder="apellidos" id="apellidos" autocomplete="off">
                </div>
            </div>
        </div>
        <div class="input">
            <div class="form__inputBox form__inputBox--selector">
                <i class="ri-id-card-line" id="selector__icono"></i>
                <select class="selector" id="tiposDocumento">
                    <option value="" hidden>Seleccione un tipo de documento...</option>
                </select>
            </div>
        </div>
        <div class="input">
            <div class="form__inputBox">
                <i class="ri-info-card-line"></i>
                <input type="text" id="numeroDocumento" placeholder="numero de documento" autocomplete="off">
            </div>
        </div>
        <div class="input">
            <div class="form__inputBox form__inputBox--selector">
                <i class="ri-men-line" id="selector__icono"></i>
                <select class="selector" id="generos">
                    <option value="" hidden>Seleccione un genero...</option>
                </select>
            </div>
        </div>
        <div class="input">
            <div class="form__inputBox--double">
                <div class="input">
                    <div class="form__inputBox">
                        <i class="ri-cake-2-line"></i>
                        <input type="date" placeholder="fecha de nacimiento" id="nacimiento" autocomplete="off">
                    </div>
                </div>
                <div class="input">
                    <div class="form__inputBox">
                        <i class="ri-phone-line"></i>
                        <input type="text" placeholder="celular" id="telefono" autocomplete="off">
                    </div>
                </div>
            </div>
        </div>
        <div class="input">
            <div class="form__inputBox form__inputBox--selector">
                <i class="ri-team-line" id="selector__icono"></i>
                <select class="selector" id="seccionales">
                    <option value="" hidden>Seleccione una seccional...</option>
                </select>
            </div>
        </div>
        <div class="input">
            <div class="form__inputBox form__inputBox--selector">
                <i class="ri-group-3-line" id="selector__icono"></i>
                <select class="selector" id="organizaciones" disabled>
                    <option value="" hidden>Seleccione una organizacion...</option>
                </select>
            </div>
        </div>
        <div class="input">
            <div class="form__inputBox">
                <i class="ri-mail-line"></i>
                <input type="text" placeholder="correo eletronico" id="correoElectronico" autocomplete="off">
            </div>
        </div>
        <div class="input">
            <div class="form__inputBox">
                <i class="ri-lock-2-line"></i>
                <input type="password" placeholder="contraseña" id="contrasena" autocomplete="off">
            </div>
        </div>
        <div class="input">
            <div class="form__inputBox">
                <i class="ri-lock-unlock-line"></i>
                <input type="password" placeholder="confirmar contraseña" id="confirmarContrasena" autocomplete="off">
            </div>
        </div>
        <button class="form__boton boton" disabled>Crear cuenta</button>
    </form>
    <button class="form__link" id="tengoCuenta">Ya tengo cuenta</button>
</div>
