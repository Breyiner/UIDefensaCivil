<div class="container container--noHeader">
        <div class="introduccion">
            <img src="../../../../public/logo.png" alt="logo" class="introduccion__logo">
            <h2 class="introduccion__titulo">Plan familiar de emergencia</h2>
            <p class="introduccion__texto">Planificación familiar para la prevención y respuesta ante emergencias</p>
            <img src="../../../../public/familiapng.png" alt="imagen" class="introduccion__imagen">
        </div>
        <div class="login">
            <img src="logo.png" alt="logoDefensaCivil" class="login__logo">
            <form class="form">
                <h2 class="form__titulo">Bienvenido!</h2>
                <h4 class="form__subtitulo">Inicie Sesión</h4>
                <div class="input">
                    <div>
                        <input type="text" class="input--naranja" id="correo" placeholder="Correo Electronico" autocomplete="off">
                    </div>
                </div>
                <div class="input">
                    <div>
                        <input type="password" class="input--naranja" id="contrasena" placeholder="Contraseña" autocomplete="off">
                    </div>
                </div>
                <button class="boton" id="login">Ingresar</button>
            </form>
            <button id="recuperarContrasena" class='form__link'>¿Olvido su contraseña?</button>
            <div class="decoration">
                <div class="decoration__linea"></div>
                <p class="decoration__text">o</p>
                <div class="decoration__linea"></div>
            </div>
            <button id="crearCuenta" class="container__boton boton--azul boton">Crear Cuenta</button>
        </div>
    </div>
