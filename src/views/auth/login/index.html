<div class="container noHeader">
    <div class="login">
        <img src="logo.png" alt="logoDefensaCivil" class="login__logo">
        <form method="POST" class="form">
            <h2>Bienvenido!</h2>
            <h4>Inicie Sesión</h4>
            <div class="input">
                <div>
                    <input type="text" class="input--naranja" id="correo" placeholder="Correo Electronico" autocomplete="off" data-tipo="correo">
                </div>
            </div>
            <div class="input">
                <div>
                    <input type="password" class="input--naranja" id="contrasena" placeholder="Contraseña" autocomplete="off" data-tipo="password">
                </div>
            </div>
            <button class="boton" id="botonLogin">Ingresar</button>
        </form>
        <button id="recuperarContrasena" class='form__link'>¿Olvido su contraseña?</button>
        <div class="decoration">
            <div class="decoration__linea"></div>
            <p>o</p>
            <div class="decoration__linea"></div>
        </div>
        <button id="crearCuenta" class="container__boton boton--azul boton" href="">Crear Cuenta</button>
    </div>
</div>
