<header class="header">
    <button class="header__boton header__boton--padding header__boton--oscuro" id="botonBack">
        <i class="ri-arrow-left-s-line header__icono"></i>
    </button>

    <div class="header__contenedor">
        <button class="header__boton" id="botonHome">
            <img src="/logo.png" alt="Logotipo" class="header__imagen-logo">
        </button>
        <div class="header__texto">
            <p class="header__subtitulo">PLAN FAMILIAR DE</p>
            <p class="header__titulo">EMERGENCIA</p>
        </div>
    </div>

    <div class="header__contenedor">
        <button class="header__boton header__boton--padding header__boton--notificacion header__boton--oscuro" id="botonNotificaciones">
            <i class="header__icono ri-notification-2-fill"></i>
            <span class="header__indicador"></span>
        </button>
        <button class="header__boton header__boton--padding header__boton--oscuro" id="botonPerfil">
            <i class="header__icono ri-user-3-fill"></i>
        </button>
    </div>

</header>
