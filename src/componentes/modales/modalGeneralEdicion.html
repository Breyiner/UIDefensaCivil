<dialog class="modal-edicion" id="modalEdicion">
    <div class="modal-edicion__cabecera">
        <h2 class="modal-edicion__titulo" id="modalEdicionTitulo">Título de Edición</h2>
    </div>

    <div class="modal-edicion__content">
        <form class="modal-edicion__formulario" id="modalEdicionForm" onsubmit="event.preventDefault();">
            
            <div class="modal-edicion__grupo">
                <i class="ri-settings-4-fill modal-edicion__icono" id="modalEdicionIcono"></i>
                <input type="text" id="modalEdicionInput" class="modal-edicion__input" placeholder="Ingrese la información aquí" autocomplete="off" required>
            </div>
            
        </form>
    </div>

    <div class="modal-edicion__pie">
        <button class="modal-edicion__btn modal-edicion__btn--secundario" type="button" id="modalEdicionBtnCancelar">Cancelar</button>
        <button class="modal-edicion__btn modal-edicion__btn--primario" type="submit" form="modalEdicionForm" id="modalEdicionBtnGuardar">Guardar</button>
    </div>
</dialog>
