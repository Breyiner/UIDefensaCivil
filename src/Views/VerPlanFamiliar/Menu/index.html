<div class="container">
  <div class="informacion">
    <p>Familia </p>
    <button class="informacion__pdf boton--redondo">

    </button>
  </div>

  <div class="menuFamilia">
    <button id="integrante" class="menuFamilia__boton boton boton--azul boton--grande boton--menu" id="integrantes">
      <i class="ri-user-add-line"></i>
      <span>Integrantes</span>
    </button>

    <button class="menuFamilia__boton boton boton--azul boton--grande boton--menu" id="mascotas">

      <span>Plan de Acción</span>

    <button class="menuFamilia__boton boton boton--azul boton--grande boton--menu" id="grafico-entorno">

  <form>
