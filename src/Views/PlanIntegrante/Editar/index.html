<div class="container">
    <div class="explicacion">
        <p class="explicacion__titulo">Integrante de la familia</p>
        <p class="explicacion__subtitulo">Editar informacion y añadir enfermedad, discapacidad y alergias</p>
    </div>

<div class="acordeon">
    <button class="acordeon__nombre">
        <div class="acordeon__iconoTitulo">
            <i class="ri-user-line acordeon__icono"></i>
            <p class="acordeon__titulo">Datos del integrante</p>
        </div>
        <div class="acordeon__flecha">
            <i class="ri-arrow-down-s-line"></i>
        </div>
    </button>
    <div class="acordeon__contenido--oculto" id="acordeon__container">
            <div class="form__inputBox">
        <i class="ri-user-fill"></i>
        <input type="text" class="form__input input__nombres" placeholder="nombres" autocomplete="off">
    </div>
    <div class="form__inputBox">
        <i class="ri-user-fill"></i>
        <input type="text" class="form__input input__apellidos" placeholder="apellidos" autocomplete="off">
    </div>
    <div class="form__inputBox">
        <i class="ri-id-card-fill"></i>
        <select class="form__input input__tipoDocumento">
        <option value ="0" hidden>Seleccione un tipo de documento</option>
        </select>
    </div>
    <div class="form__inputBox">
        <i class="ri-info-card-fill"></i>
        <input type="text" class="form__input input__numDocumento" placeholder="numero de documento" autocomplete="off">
    </div>
    <div class="form__inputBox">
        <i class="ri-men-fill"></i>
        <select class="form__input input__genero">
        <option value ="0" hidden>Seleccione un genero</option>
        </select>
    </div>
    <div class="form__inputBox--double">
        <div class="form__inputBox">
            <i class="ri-cake-2-fill"></i>
            <input type="date" class="form__input input__nacimiento" placeholder="fecha de nacimiento" autocomplete="off">
        </div>
        <div class="form__inputBox">
            <i class="ri-hospital-line"></i>
            <input type="text" class="form__input input__eps" placeholder="eps" autocomplete="off">
        </div>
    </div>
    <div class="form__inputBox">
        <i class="ri-team-fill"></i>
        <select class="form__input input__parentesco">
        <option value ="0" hidden>Seleccione un parentesco</option>
        </select>
    </div>
    <div class="form__inputBox">
        <i class="ri-team-fill"></i>
        <select class="form__input input__grupoSanguineo">
        <option value ="0" hidden>Seleccione un grupo sanguineo</option>
        </select>
    </div>
    <div class="form__inputBox">
        <i class="ri-team-fill"></i>
        <select class="form__input input__nacionalidad">
        <option value ="0" hidden>Seleccione un nacionalidad</option>
        </select>
    </div>
    <div class="form__inputBox">
            <i class="ri-phone-fill"></i>
            <input type="text" class="form__input input__celular" placeholder="celular personal" autocomplete="off">
    </div>
    <button class="form__boton boton" disabled>Guardar</button>
</form>
    </div>
</div>


<div class="acordeon">
    <button class="acordeon__nombre">
        <div class="acordeon__iconoTitulo">
            <i class="ri-medicine-bottle-line acordeon__icono"></i>
            <p class="acordeon__titulo">Afeccion del integrante</p>
        </div>
        <div class="acordeon__flecha">
            <i class="ri-arrow-down-s-line"></i>
        </div>
    </button>
    <div class="acordeon__contenido--oculto" id="acordeon__container">
        <div class="gestioarAfecciones">
            <div class="gestionarAfecciones__header">
                <div class="gestionarAfecciones__titulo">
                    <i class="ri-capsule-fill"></i>
                    <p>Enfermedad,Alergia y </p>
                </div>
                <button class="gestionarAfecciones__boton boton">Agregar nuevo</button>
            </div>
            <div class="gestionarAfecciones__lista">
            </div>
        </div>
    </div>
</div>
</div>
