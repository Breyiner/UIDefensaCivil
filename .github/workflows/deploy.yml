name: Despliegue de Frontend (Defensa)

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v3

      #1: Preparamos el entorno de Node.js en el corredor de GitHub
      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      #2: Instalamos las dependencias en GitHub, no en el VPS
      - name: Instalar dependencias
        run: npm install

      #3: Si tienes un script de construcción (Tailwind, Vite, etc.), se ejecuta aquí
      - name: Ejecutar Build (si existe)
        run: npm run build --if-present

      #4: Eliminamos node_modules para que el SCP no se bloquee subiendo miles de archivos
      - name: Eliminar node_modules para el despliegue
        run: rm -rf node_modules

      - name: Desplegar archivos al VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "./*" 
          target: "/var/www/defensa.johnbecerra.dev"
          strip_components: 0