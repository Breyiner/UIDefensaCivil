name: Despliegue de Frontend (Defensa)

on:
  push:
    branches:
      - develop # Se dispara solo al subir cambios a la rama develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código del repositorio
      - name: Obtener código del repositorio
        uses: actions/checkout@v3

      # 2. Preparar el entorno de Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: npm install

      # 4. Construir el proyecto (Vite genera la carpeta /dist)
      # Es vital pasar la variable de entorno AQUÍ para que se inyecte en el JS compilado
      - name: Ejecutar Build de Producción
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # 5. Desplegar SOLAMENTE el contenido de la carpeta dist al VPS
      - name: Desplegar archivos al VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.IP_SERVER }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # Explicación pedagógica:
          # source: "dist/*" indica que solo tomamos lo que está dentro de dist
          # strip_components: 1 evita que se cree una carpeta llamada "dist" en el servidor
          source: "dist/*"
          target: "/var/www/defensa.johnbecerra.dev"
          strip_components: 1
          overwrite: true # Asegura que los archivos viejos sean reemplazados